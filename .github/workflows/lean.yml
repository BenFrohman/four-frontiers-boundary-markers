name: Lean 4 Kernel Certification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan and Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Mathlib and Lake packages
        uses: actions/cache@v4
        with:
          path: |
            .lake
            ~/.cache/mathlib
          key: ${{ runner.os }}-lake-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}

      - name: Fetch Mathlib cache and build all modules
        run: |
          lake exe cache get
          lake build

      - name: Verify zero sorry / admit / custom axioms
        run: |
          if grep -rnE '\b(sorry|admit|axiom)\b' --include='*.lean' .; then
            echo "Found forbidden sorry, admit, or custom axiom"
            exit 1
          fi

      - name: Print axioms on key theorems
        run: |
          lake env lean -c /dev/null --stdin << 'EOF'
          import FrontiersArchitecture
          #print axioms FrontiersArchitecture.master_frontier_reduction
          EOF
