name: Lean 4 Kernel Certification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan and Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Fetch Mathlib cache
        run: |
          lake exe cache get || echo "Cache fetch failed; continuing with full build"

      - name: Build all modules
        run: lake build

      - name: Verify zero sorry / admit / custom axioms
        run: |
          if grep -rnE '\b(sorry|admit|axiom)\b' Fourfrontiers/ FrontiersArchitecture.lean 2>/dev/null; then
            echo "Found forbidden sorry, admit, or custom axiom"
            exit 1
          else
            echo "No forbidden keywords found"
          fi

      - name: Print axioms on available theorems
        run: |
          lake env lean --stdin << 'EOF' || true
          import FrontiersArchitecture
          #print axioms FrontiersArchitecture.master_frontier_reduction
          EOF
          echo "Axiom check completed (or skipped if module unavailable)"
